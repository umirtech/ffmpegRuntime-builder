name: Build and Release FFmpeg Runtime Package

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select Build Type"
        required: true
        default: "Minimal"
        type: choice
        options:
          - Full
          - Minimal
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: ffmpeg-runtime-package-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: ${{ github.event_name == 'push' && 'Full' || inputs.build_type || 'Minimal' }}

jobs:
  build:
    name: Build via compile workflow (reuse)
    uses: ./.github/workflows/compile.yml
    with:
      build_type: ${{ env.BUILD_TYPE }}

  package:
    name: Package and release FFmpeg Runtime
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout packaging script
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download per-ABI builds from compile workflow
        uses: actions/download-artifact@v8
        with:
          pattern: ffshell-libffmpeg-*
          path: ./combined

      - name: Verify all ABI artifacts are present
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "combined/ffshell-libffmpeg-${abi}/lib/libffmpeg.so" || {
              echo "Missing combined/ffshell-libffmpeg-${abi}/lib/libffmpeg.so"
              exit 1
            }
          done
          echo "All four ABI artifacts are present."

      - name: Build distributable package via shared package.sh
        run: |
          chmod +x package.sh
          BUILD_TYPE="${BUILD_TYPE}" ./package.sh

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd build/package && sha256sum *.zip > sha256sums.txt)
          ls -lh build/package

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            build/package/*.zip
            build/package/manifest.json
            build/package/sha256sums.txt
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FFmpeg Runtime ${{ env.PKG_VERSION }} (${{ env.PKG_BUILD_TYPE }})
          files: |
            build/package/*.zip
            build/package/manifest.json
            build/package/sha256sums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove intermediate ABI artifacts
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("ffshell-libffmpeg-")) | .id' |
          while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
